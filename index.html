<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Picker</title>
<link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <main class="card" id="card">
    <header>
      <span class="label">STUDIO</span>
      <h1>Color<br>Picker</h1>
    </header>

    <div class="picker-wrap">
      <label class="swatch-label" for="colorInput">
        <div class="swatch" id="swatch"></div>
        <span>Choose a color</span>
      </label>
      <input type="color" id="colorInput" value="#6C63FF" />
    </div>

    <div class="values">
      <div class="value-block">
        <p class="val-label">HEX</p>
        <p class="val-text" id="hexVal">#6C63FF</p>
      </div>
      <div class="divider"></div>
      <div class="value-block">
        <p class="val-label">RGB</p>
        <p class="val-text" id="rgbVal">108, 99, 255</p>
      </div>
    </div>

    <button class="copy-btn" id="copyBtn">
      <span id="btnText">Copy HEX</span>
      <svg id="checkIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
